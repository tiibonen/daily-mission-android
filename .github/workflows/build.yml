name: Build Daily Mission

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack fixed project
        run: |
          unzip -o daily-mission-android-project-fixed.zip

      - name: Build APK
        working-directory: daily-mission-android-fixed
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-mission-apk-fixed
          path: daily-mission-android-fixed/app/build/outputs/apk/debug/app-debug.apk
